# Name of your application. Used to uniquely configure containers.
service: auth-demo 

## UNCOMMENT ONE
#
# image: dockerhub_username/service_name # docker hub registry image
# image: namespace_or_username/service_name # gitlab registry image.
image: gitnvincadonis/auth-demo # GitHub Container Registry paths must be lowercase

registry: # Where you keep your container images.
  # # docker hub
  # username: username
  # password:
  # - KAMAL_REGISTRY_PASSWORD


  # # Gitlab image hosting
  # server: registry.gitlab.com
  # username: GITnvincAdonis
  # password:
  # - KAMAL_REGISTRY_PASSWORD


  # Github image hosting 
  server: ghcr.io
  username: GITnvincAdonis
  password:
    - KAMAL_REGISTRY_PASSWORD


# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST") %>
      # Assumes traefik will handle proxy so no need to setup kamal default proxy.
    proxy: false
    options:
      network:
        - traefik_proxy # A custom docker network that the traefik container is running on
        # This assumes a running postgress container lives on the VPS. 
        # THe allow option allows the application and the database to connect.
        - postgres-pgadmin_postgres-network

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
labels:
  traefik.enable: "true"
  traefik.http.routers.service_name.rule: "Host(`service_name.org`)"
  traefik.http.routers.service_name.entrypoints: "websecure" # assumes VPS has certificates setup
  traefik.http.routers.service_name.tls: "true" # enables tls crypt session handshake between server and clients 
  traefik.http.routers.service_name.tls.certresolver: "letsencrypt" # The built in traefik certs resolver
  traefik.http.services.service_name.loadbalancer.server.port: "3000" # Service (Rails app port inside container)
  traefik.docker.network: "traefik_proxy" # Matches the option set in the server configuration above



# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET

  clear: {}
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Rails reads the production database connection from DATABASE_URL.
    # Example:
    # DATABASE_URL=postgresql://postgres:password@152.53.249.30:5432/service_name_production

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "service_name_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER") %>
  port: <%= ENV.fetch("KAMAL_SSH_PORT").to_i %>
  keys:
    - <%= ENV.fetch("KAMAL_SSH_KEY") %>

