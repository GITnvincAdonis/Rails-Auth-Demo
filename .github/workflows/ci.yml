name: CI

on:
  push:
  pull_request:

jobs:
  bundle_install:
    runs-on: ubuntu-latest
    container:
      image: nvincadonis/ruby-npm-postgres:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            bundle-${{ runner.os }}-
      - name: Install gems
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

  rspec:
    runs-on: ubuntu-latest
    needs: bundle_install
    container:
      image: nvincadonis/ruby-npm-postgres:latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: <db_name>
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_URL: postgres://postgres:postgres@db:5432/<db_name>
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            bundle-${{ runner.os }}-
      - name: Install gems
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle check || bundle install
      - run: bundle exec rails db:prepare
      - run: bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest
    needs: bundle_install
    container:
      image: nvincadonis/ruby-npm-postgres:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            bundle-${{ runner.os }}-

      - name: Install gems
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle check || bundle install
      - run: bundle exec rubocop
